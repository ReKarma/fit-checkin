<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f8f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈打卡"><link rel="apple-touch-icon" href="./public/icon.svg"><link rel="stylesheet" href="./src/styles.css"><title>轻盈打卡</title></head><body><div id="root"></div><script src="./app.js"></script><script>document.addEventListener('focusin',e=>{if(e.target.id!=='weight'||document.querySelector('.input-done'))return;let b=document.createElement('button');b.type='button';b.className='input-done';b.textContent='确认';b.style.cssText='margin-left:10px;border:0;border-radius:12px;background:#1f2922;color:#fff;padding:10px 13px;font-weight:700;font-size:12px';b.onclick=()=>document.querySelector('[data-save="weight"]')?.click();e.target.closest('.weight-input')?.append(b)});document.addEventListener('keydown',e=>{if(e.target.id==='weight'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-save="weight"]')?.click()}});</script></body></html>
