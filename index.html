<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f8f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈打卡"><link rel="apple-touch-icon" href="./public/icon.svg"><link rel="stylesheet" href="./src/styles.css"><title>轻盈打卡</title></head><body><div id="root"></div><script src="./app.js"></script><script>const addDone=()=>{let input=document.querySelector('#weight'),wrap=input?.closest('.weight-input');if(!wrap||wrap.querySelector('.input-done'))return;let btn=document.createElement('button');btn.type='button';btn.className='input-done';btn.textContent='确认';btn.style.cssText='margin-left:10px;border:0;border-radius:12px;background:#1f2922;color:#fff;padding:10px 13px;font-weight:700;font-size:12px';btn.onclick=()=>document.querySelector('[data-save="weight"]')?.click();wrap.append(btn)};new MutationObserver(addDone).observe(document.documentElement,{childList:true,subtree:true});addDone();document.addEventListener('keydown',e=>{if(e.target.id==='weight'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-save="weight"]')?.click()}});</script></body></html>
